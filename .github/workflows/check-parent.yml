# Nightly: check if parent repo has a new semver tag; if so, trigger Shard sync.
# Uses cache to store last seen parent version (semver tag).
# Requires secret ORG_GH_COCOA_TOKEN with read access to the parent repo.
name: Check parent repo

on:
  schedule:
    - cron: '0 0 * * *'  # midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: |
            ShardSpec.yml
            .github/actions/get-latest-parent-version
          sparse-checkout-cone-mode: false

      - name: Restore last parent version (cache)
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: .parent-version
          key: parent-version

      - name: Get latest parent version tag
        id: parent
        uses: ./repo/.github/actions/get-latest-parent-version
        with:
          shard_spec_path: repo/ShardSpec.yml
          token: ${{ secrets.ORG_GH_COCOA_TOKEN }}

      - name: Get last upstream version (from cache)
        id: prev
        run: |
          PREV=$(cat .parent-version/version 2>/dev/null || echo "")
          echo "prev=$PREV" >> $GITHUB_OUTPUT
          echo "Last upstream version (cache): ${PREV:-<none>}"

      - name: Check and trigger Shard sync
        id: check_trigger
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.parent.outputs.version }}
          PREV: ${{ steps.prev.outputs.prev }}
        run: |
          echo "Previous version: $PREV | Current version: $CURRENT"
          if [ "$PREV" != "$CURRENT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Parent repo has new version $CURRENT, triggering Shard sync..."
            gh workflow run "Shard sync" --ref main
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new version in parent repo."
          fi