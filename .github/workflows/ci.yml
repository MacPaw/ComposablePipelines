name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux · Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
