# Reusable action: parse ShardSpec and get latest semver-compatible tag from the parent repo.
# Outputs: repo (owner/repo), version (tag), stable (true if no prerelease suffix).
name: Get latest parent version
description: Parses ShardSpec.yml for parentRepo and fetches the latest semver tag from that repo.

inputs:
  shard_spec_path:
    description: 'Path to ShardSpec.yml (e.g. repo/ShardSpec.yml)'
    required: true
  token:
    description: 'GitHub token with repo read access (e.g. secrets.ORG_GH_COCOA_TOKEN)'
    required: true

outputs:
  repo:
    description: 'Parent repo in owner/repo format'
    value: ${{ steps.get.outputs.repo }}
  version:
    description: 'Latest semver tag (e.g. 1.0.0 or 1.0.0-beta1)'
    value: ${{ steps.get.outputs.version }}
  stable:
    description: 'true if version has no prerelease suffix (-), false otherwise'
    value: ${{ steps.get.outputs.stable }}

runs:
  using: composite
  steps:
    - name: Parse ShardSpec and get latest semver tag
      id: get
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SHARD_SPEC: ${{ inputs.shard_spec_path }}
      run: |
        if [ ! -f "$SHARD_SPEC" ]; then
          echo "::error::ShardSpec not found at $SHARD_SPEC"
          exit 1
        fi
        PARENT_REPO=$(yq -r '.parentRepo' "$SHARD_SPEC")
        REPO=$(echo "$PARENT_REPO" | sed -n 's/.*github\.com[:\/]\([^\/]*\/[^.]*\).*/\1/p')
        if [ -z "$REPO" ]; then
          echo "::error::Could not parse parentRepo from $SHARD_SPEC (expected github.com URL)."
          exit 1
        fi
        echo "Parsed parent: $REPO"
        API_OUTPUT=$(gh api "repos/${REPO}/tags" --paginate -q '.[].name' 2>&1) || true
        TAGS="$API_OUTPUT"
        if [ -z "$TAGS" ]; then
          echo "::error::Could not get tags for ${REPO}. Ensure token is set and has read access to the parent repo."
          echo "::error::API output: $API_OUTPUT"
          exit 1
        fi
        # Semver-compatible: v?major.minor.patch or v?major.minor.patch-prerelease (e.g. 1.0.0-beta1)
        VERSION=$(echo "$TAGS" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-.+)?$' | sort -V | tail -1)
        if [ -z "$VERSION" ]; then
          echo "::error::No semver-compatible tag found in ${REPO}."
          exit 1
        fi
        # Stable = no hyphen in version (e.g. 1.0.0 is stable, 1.0.0-beta1 is not)
        if [[ "$VERSION" == *-* ]]; then
          STABLE=false
        else
          STABLE=true
        fi
        echo "Latest version: $VERSION (stable=$STABLE)"
        echo "repo=$REPO" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "stable=$STABLE" >> "$GITHUB_OUTPUT"